# Build the API image, load it into the kind cluster created by Terraform,
# deploy Redis, the API, Prometheus and Grafana, then smoke-test everything.
#
#   cd deploy/ansible && ansible-playbook site.yml

- name: Deploy the idempotency engine to Kubernetes
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Build the API image
      ansible.builtin.command:
        cmd: docker build -t {{ image }} {{ repo_root }}
      changed_when: true

    - name: Load the image into the kind nodes
      ansible.builtin.command:
        cmd: kind load docker-image {{ image }} --name {{ cluster_name }}
      changed_when: true

    - name: Create the namespace
      kubernetes.core.k8s:
        state: present
        apply: true
        definition: "{{ lookup('ansible.builtin.template', 'namespace.yaml.j2') | ansible.builtin.from_yaml }}"

    - name: Load Grafana provisioning and the dashboard into ConfigMaps
      kubernetes.core.k8s:
        state: present
        apply: true
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: "{{ item.name }}"
            namespace: "{{ namespace }}"
          data: "{{ {item.key: lookup('ansible.builtin.file', monitoring_dir + '/' + item.src)} }}"
      loop:
        - {name: grafana-datasources, key: prometheus.yml, src: provisioning/datasources/prometheus.yml}
        - {name: grafana-dashboard-provider, key: dashboards.yml, src: provisioning/dashboards/dashboards.yml}
        - {name: grafana-dashboards, key: idempotency.json, src: dashboards/idempotency.json}
      loop_control:
        label: "{{ item.name }}"

    - name: Apply manifests
      kubernetes.core.k8s:
        state: present
        apply: true
        definition: "{{ lookup('ansible.builtin.template', item + '.yaml.j2') | ansible.builtin.from_yaml_all | list }}"
      loop: [redis, api, monitoring]

    - name: Wait for every deployment to roll out
      ansible.builtin.command:
        cmd: kubectl -n {{ namespace }} rollout status deployment/{{ item }} --timeout=240s
      loop: [redis, api, prometheus, grafana]
      changed_when: false

    - name: Wait until the API answers through the NodePort
      ansible.builtin.uri:
        url: "{{ api_url }}/health"
        return_content: true
      register: health
      until: health.status == 200 and health.json.redis_connected
      retries: 30
      delay: 2

    - name: Pick a fresh idempotency key for the smoke test
      ansible.builtin.set_fact:
        smoke_key: "smoke-{{ image_tag }}-{{ 999999 | random }}"

    - name: Smoke test, first request runs the handler
      ansible.builtin.uri:
        url: "{{ api_url }}/api/v1/payments"
        method: POST
        body_format: json
        body: {user_id: smoke, amount: 5000, currency: NGN}
        headers: {X-Idempotency-Key: "{{ smoke_key }}"}
        status_code: 200
      register: first

    - name: Smoke test, retry with the same key is replayed from the cache
      ansible.builtin.uri:
        url: "{{ api_url }}/api/v1/payments"
        method: POST
        body_format: json
        body: {user_id: smoke, amount: 5000, currency: NGN}
        headers: {X-Idempotency-Key: "{{ smoke_key }}"}
        status_code: 200
      register: replay
      failed_when: replay.idempotent_replay | default('') != 'true' or replay.json != first.json

    - name: Smoke test, same key with a different amount is rejected
      ansible.builtin.uri:
        url: "{{ api_url }}/api/v1/payments"
        method: POST
        body_format: json
        body: {user_id: smoke, amount: 9000, currency: NGN}
        headers: {X-Idempotency-Key: "{{ smoke_key }}"}
        status_code: 400

    - name: Wait until Prometheus has discovered every API pod
      ansible.builtin.uri:
        url: "{{ prometheus_url }}/api/v1/query?query=count(up%3D%3D1)"
        return_content: true
      register: targets
      until: >-
        targets.json.data.result | length > 0 and
        targets.json.data.result[0].value[1] | int == api_replicas
      retries: 30
      delay: 3

    - name: Wait until Grafana has loaded the dashboard
      ansible.builtin.uri:
        url: "{{ grafana_url }}/api/dashboards/uid/idempotency"
        return_content: true
      register: dashboard
      until: dashboard.status == 200
      retries: 30
      delay: 3

    - name: Show where everything is running
      ansible.builtin.debug:
        msg:
          - "API:        {{ api_url }} ({{ api_replicas }} replicas, image {{ image }})"
          - "Grafana:    {{ grafana_url }}"
          - "Prometheus: {{ prometheus_url }}"
