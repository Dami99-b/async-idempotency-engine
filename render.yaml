services:
  - type: web
    name: async-idempotency-engine
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: idempotency-store
          property: connectionString
      - key: IDEMPOTENCY_TTL
        value: "86400"
      - key: IDEMPOTENCY_LOCK_TTL
        value: "300"
      - key: CIRCUIT_BREAKER_FAIL_MAX
        value: "5"
      - key: CIRCUIT_BREAKER_TIMEOUT
        value: "60"

  - type: keyvalue
    name: idempotency-store
    plan: free
    ipAllowList: []
