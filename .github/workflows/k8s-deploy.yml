name: Kubernetes deploy (Terraform + Ansible)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - "app/**"
      - "Dockerfile"
      - "scripts/load.py"
      - ".github/workflows/k8s-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TF_IN_AUTOMATION: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible, the Kubernetes collection and kind
        run: |
          pip install ansible-core kubernetes httpx
          ansible-galaxy collection install kubernetes.core
          if ! command -v kind >/dev/null; then
            curl -sSLo kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
            chmod +x kind && sudo mv kind /usr/local/bin/kind
          fi
          kind version && kubectl version --client && terraform version

      - name: Terraform fmt and validate
        working-directory: deploy/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -input=false
          terraform validate

      - name: Terraform apply (create the kind cluster)
        working-directory: deploy/terraform
        run: terraform apply -auto-approve -input=false

      - name: Point kubectl at the new cluster
        run: echo "KUBECONFIG=$(terraform -chdir=deploy/terraform output -raw kubeconfig_path)" >> "$GITHUB_ENV"

      - name: Ansible deploy and smoke test
        working-directory: deploy/ansible
        run: ansible-playbook site.yml

      - name: Cluster state
        run: |
          kubectl get nodes -o wide
          kubectl -n idempotency get deploy,pods,svc,pdb -o wide
          NODES=$(kubectl get nodes --no-headers | wc -l)
          SPREAD=$(kubectl -n idempotency get pods -l app=api -o jsonpath='{range .items[*]}{.spec.nodeName}{"\n"}{end}' | sort -u | wc -l)
          echo "::notice title=Cluster::$NODES nodes; 3 API replicas spread across $SPREAD nodes"

      - name: Delete an API pod while traffic is flowing
        run: |
          python scripts/load.py --base http://localhost:8080 --seconds 60 --concurrency 10 > load.txt &
          LOAD=$!
          sleep 20
          POD=$(kubectl -n idempotency get pods -l app=api -o jsonpath='{.items[0].metadata.name}')
          echo "Deleting $POD"
          kubectl -n idempotency delete pod "$POD" --wait=false
          kubectl -n idempotency rollout status deployment/api --timeout=120s
          wait $LOAD
          cat load.txt
          kubectl -n idempotency get pods -l app=api
          echo "::notice title=Pod killed under load::$(cat load.txt)"

      - name: Rolling update under load
        run: |
          python scripts/load.py --base http://localhost:8080 --seconds 60 --concurrency 10 > rollout.txt &
          LOAD=$!
          sleep 10
          kubectl -n idempotency rollout restart deployment/api
          kubectl -n idempotency rollout status deployment/api --timeout=180s
          wait $LOAD
          cat rollout.txt
          echo "::notice title=Rolling restart under load::$(cat rollout.txt)"

      - name: Terraform destroy
        if: always()
        working-directory: deploy/terraform
        run: terraform destroy -auto-approve -input=false
